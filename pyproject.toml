[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eom-empirical"
version = "0.1.0"
description = "Reproducible empirical benchmark and data schemas for the Entropy-Oriented Migration model"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "requests>=2.31", "scikit-learn>=1.3", "scipy>=1.10", "matplotlib>=3.7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
