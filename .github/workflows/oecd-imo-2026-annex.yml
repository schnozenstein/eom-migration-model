name: OECD IMO 2026 A-series StatLink Ingestion

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/oecd_imo_2026_annex.py"
      - "tests/test_oecd_imo_2026_annex.py"
      - ".github/workflows/oecd-imo-2026-annex.yml"
      - "requirements.txt"
  pull_request:
    paths:
      - "scripts/oecd_imo_2026_annex.py"
      - "tests/test_oecd_imo_2026_annex.py"
      - ".github/workflows/oecd-imo-2026-annex.yml"
      - "requirements.txt"
  workflow_dispatch:
  schedule:
    - cron: "40 7 * * *"

permissions:
  contents: write

concurrency:
  group: oecd-imo-2026-annex-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install beautifulsoup4 lxml pytest
      - name: Run OECD annex parser tests
        run: python -m pytest -q tests/test_oecd_imo_2026_annex.py
      - name: Retrieve and normalize OECD IMO 2026 annex
        if: github.event_name != 'pull_request'
        id: ingest
        run: python scripts/oecd_imo_2026_annex.py
      - name: Upload immutable raw snapshot and normalized extract
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: oecd-imo-2026-annex-${{ github.run_id }}
          retention-days: 365
          if-no-files-found: error
          path: |
            data/raw/snapshots/oecd_imo_2026/
            data/derived/oecd_imo_2026/
            data/observations_history/oecd_imo_2026_a_series_history.csv
            metadata/oecd_imo_2026/
            reports/oecd_imo_2026_a_series_*.md
      - name: Commit compact revision ledger and manifests
        if: success() && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observations_history/oecd_imo_2026_a_series_history.csv metadata/oecd_imo_2026/ reports/oecd_imo_2026_a_series_*.md
          git commit -m "Automated OECD IMO 2026 annex ingestion [skip ci]" || echo "No new OECD annex observations or metadata changes"
          git push origin HEAD:main
