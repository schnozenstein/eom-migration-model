name: EOM Daily Refresh

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/refresh_eom_data.py"
      - "scripts/create_daily_summary.py"
      - "tests/**"
      - ".github/workflows/eom-daily-refresh.yml"
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest

      - name: Run tests
        id: tests
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python -m pytest -q

      - name: Refresh EOM data
        id: refresh_data
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python scripts/refresh_eom_data.py

      - name: Create human-readable report
        if: always()
        run: python scripts/create_daily_summary.py

      - name: Upload daily report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eom-daily-report-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            reports/latest_daily_summary.md
            metadata/live_source_status.csv
            metadata/policy_page_watch_status.csv
            metadata/refresh_runs/*.json
            outputs/data_freshness_dashboard.csv

      - name: Commit report and refreshed data
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Automated EOM data refresh"
            git push
          fi

      - name: Mark run failed if tests or data refresh failed
        if: always() && (steps.tests.outcome == 'failure' || steps.refresh_data.outcome == 'failure')
        run: |
          echo "Daily report was generated, but tests or live data refresh failed. Inspect the source status CSV and step logs."
          exit 1
