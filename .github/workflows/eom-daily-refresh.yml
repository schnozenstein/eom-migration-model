name: EOM Daily Refresh

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/refresh_eom_data.py"
      - "scripts/rebuild_wdi_history_from_snapshots.py"
      - "scripts/create_daily_summary.py"
      - "scripts/build_source_retrieval_audit.py"
      - "scripts/build_policy_event_delta.py"
      - "scripts/maintain_prediction_ledger.py"
      - "scripts/build_macro_ranking_delta.py"
      - "tests/test_incremental_ledgers.py"
      - "src/eom_empirical/**"
      - "data/destinations.csv"
      - "data/historical_destination_year_panel.csv"
      - "LIVE_DATA_PIPELINE.md"
      - "tests/**"
      - ".github/workflows/eom-daily-refresh.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/refresh_eom_data.py"
      - "scripts/rebuild_wdi_history_from_snapshots.py"
      - "scripts/create_daily_summary.py"
      - "scripts/build_source_retrieval_audit.py"
      - "scripts/build_policy_event_delta.py"
      - "scripts/maintain_prediction_ledger.py"
      - "scripts/build_macro_ranking_delta.py"
      - "tests/test_incremental_ledgers.py"
      - "src/eom_empirical/**"
      - "data/destinations.csv"
      - "data/historical_destination_year_panel.csv"
      - "LIVE_DATA_PIPELINE.md"
      - "tests/**"
      - ".github/workflows/eom-daily-refresh.yml"
  schedule:
    - cron: "17 5 * * *"

concurrency:
  # Prevent scheduled and push-triggered refreshes from committing to main simultaneously.
  group: eom-daily-refresh-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        # Scheduled/push/manual runs can wait behind another refresh. Use the latest
        # main after queueing so generated outputs are not based on a stale event SHA.
        # PR checks still use the merge commit that triggered the check.
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip certifi
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest

      - name: Run tests
        id: tests
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python -m pytest -q

      - name: Check whether the compact WDI history ledger already exists
        id: check_wdi_ledger
        run: |
          if [ -s data/observations_history/world_bank_observations.csv.gz ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find latest successful ETL artifact for one-time WDI history migration
        id: previous_wdi_artifact
        if: steps.check_wdi_ledger.outputs.exists == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const defaultBranch = context.payload.repository?.default_branch || "main";
            const runs = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: "eom-daily-refresh.yml",
              branch: defaultBranch, status: "success", per_page: 50
            });
            const currentRun = Number(process.env.GITHUB_RUN_ID);
            const previous = runs.data.workflow_runs.find(r => r.id !== currentRun && r.head_branch === defaultBranch);
            if (!previous) {
              core.setOutput("found", "false");
              core.warning("No prior successful daily ETL run was found; refusing to silently reset WDI history.");
              return;
            }
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: previous.id, per_page: 100
            });
            const expectedName = "eom-daily-report-" + previous.id;
            const artifact = artifacts.data.artifacts.find(a => a.name === expectedName && !a.expired);
            if (!artifact) {
              core.setOutput("found", "false");
              core.warning("No retained full ETL artifact found for run " + previous.id + ".");
              return;
            }
            core.setOutput("found", "true");
            core.setOutput("run_id", String(previous.id));
            core.setOutput("artifact_id", String(artifact.id));
            core.setOutput("artifact_name", artifact.name);
            core.setOutput("artifact_digest", artifact.digest || "");

      - name: Download prior ETL artifact for WDI history migration
        if: steps.previous_wdi_artifact.outputs.found == 'true' && steps.check_wdi_ledger.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.previous_wdi_artifact.outputs.artifact_id }}
          run-id: ${{ steps.previous_wdi_artifact.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: previous-run-artifact

      - name: Rebuild compact WDI history from archived raw snapshots
        if: steps.previous_wdi_artifact.outputs.found == 'true' && steps.check_wdi_ledger.outputs.exists == 'false'
        run: |
          python scripts/rebuild_wdi_history_from_snapshots.py --input-root previous-run-artifact --output data/observations_history/world_bank_observations.csv.gz --source-artifact-run-id "${{ steps.previous_wdi_artifact.outputs.run_id }}" --source-artifact-name "${{ steps.previous_wdi_artifact.outputs.artifact_name }}" --source-artifact-digest "${{ steps.previous_wdi_artifact.outputs.artifact_digest }}" --rebuild-workflow-run-id "${{ github.run_id }}"

      - name: Require persistent WDI revision ledger
        if: always()
        run: |
          if [ ! -s data/observations_history/world_bank_observations.csv.gz ]; then
            echo "::error::No compact WDI history ledger exists and no prior artifact migration succeeded; refusing to reset historical state."
            exit 1
          fi

      - name: Snapshot previous policy-page state for a verifiable delta
        if: always() && github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP"
          if [ -f data/policy_page_state.json ]; then
            cp data/policy_page_state.json "$RUNNER_TEMP/eom_policy_state_pre_run.json"
          else
            printf '{}' > "$RUNNER_TEMP/eom_policy_state_pre_run.json"
          fi

      - name: Refresh EOM data
        if: github.event_name != 'pull_request'
        id: refresh_data
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python scripts/refresh_eom_data.py

      - name: Build conservative policy-event delta
        if: always() && github.event_name != 'pull_request'
        id: policy_delta
        continue-on-error: true
        env:
          EOM_ETL_OUTCOME: ${{ steps.refresh_data.outcome }}
        run: python scripts/build_policy_event_delta.py --previous-state "$RUNNER_TEMP/eom_policy_state_pre_run.json"

      - name: Build consolidated source-retrieval audit
        if: always() && github.event_name != 'pull_request'
        id: source_audit
        continue-on-error: true
        env:
          EOM_ETL_OUTCOME: ${{ steps.refresh_data.outcome }}
        run: python scripts/build_source_retrieval_audit.py

      - name: Maintain prediction and outcome ledgers
        if: always() && github.event_name != 'pull_request'
        id: prediction_ledger
        continue-on-error: true
        env:
          EOM_ETL_OUTCOME: ${{ steps.refresh_data.outcome }}
        run: python scripts/maintain_prediction_ledger.py

      - name: Snapshot previous macro ranking for score/rank delta
        if: always() && github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP"
          if [ -f outputs/latest_macro_eom_ranking.csv ]; then
            cp outputs/latest_macro_eom_ranking.csv "$RUNNER_TEMP/eom_ranking_pre_run.csv"
          else
            : > "$RUNNER_TEMP/eom_ranking_pre_run.csv"
          fi

      - name: Recompute macro EOM ranking from current destination set
        if: github.event_name != 'pull_request'
        id: recompute_ranking
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          python -m eom_empirical.fetch_world_bank --start 2010 --end "$(date -u +%Y)"
          python -m eom_empirical.fit_macro_model

      - name: Build macro ranking score/rank delta
        if: always() && github.event_name != 'pull_request'
        id: ranking_delta
        continue-on-error: true
        env:
          EOM_RANKING_RECOMPUTE_OUTCOME: ${{ steps.recompute_ranking.outcome }}
        run: python scripts/build_macro_ranking_delta.py --previous-ranking "$RUNNER_TEMP/eom_ranking_pre_run.csv"

      - name: Build environmental and economic risk indicator panel
        if: github.event_name != 'pull_request'
        id: risk_panel
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python -m eom_empirical.build_risk_panel

      - name: Fetch source-backed geographic hazard evidence
        if: github.event_name != 'pull_request'
        id: geographic_evidence
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python -m eom_empirical.fetch_geographical_evidence

      - name: Refresh source-backed geopolitical proxies
        if: github.event_name != 'pull_request'
        id: geopolitical_evidence
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python -m eom_empirical.fetch_geopolitical_inputs

      - name: Build geographic uncertainty adjustment (evidence-gated)
        if: github.event_name != 'pull_request'
        id: geographic_adjustment
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python -m eom_empirical.geographical_uncertainty

      - name: Create human-readable report
        if: always()
        env:
          PYTHONPATH: src
          EOM_ETL_OUTCOME: ${{ steps.refresh_data.outcome }}
          EOM_RANKING_RECOMPUTE_OUTCOME: ${{ steps.recompute_ranking.outcome }}
          EOM_SOURCE_AUDIT_OUTCOME: ${{ steps.source_audit.outcome }}
          EOM_POLICY_DELTA_OUTCOME: ${{ steps.policy_delta.outcome }}
          EOM_PREDICTION_LEDGER_OUTCOME: ${{ steps.prediction_ledger.outcome }}
          EOM_RANKING_DELTA_OUTCOME: ${{ steps.ranking_delta.outcome }}
        run: python scripts/create_daily_summary.py

      - name: Upload daily report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eom-daily-report-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            reports/latest_daily_summary.md
            metadata/live_source_status.csv
            metadata/eurostat_source_status.csv
            metadata/obmigra_source_status.csv
            metadata/policy_page_watch_status.csv
            metadata/unhcr_source_status.csv
            metadata/undesa_source_status.csv
            metadata/oecd_source_status.csv
            metadata/ilostat_source_status.csv
            metadata/refresh_runs/*.json
            outputs/data_freshness_dashboard.csv
            outputs/latest_macro_eom_ranking.csv
            outputs/macro_ranking_delta.csv
            metadata/macro_ranking_delta_manifest.json
            outputs/source_retrieval_audit.csv
            outputs/policy_event_delta.csv
            data/prediction_ledger.csv
            data/outcome_ledger.csv
            data/prediction_outcome_join.csv
            metadata/source_audit_manifest.json
            metadata/policy_event_delta_manifest.json
            metadata/prediction_ledger_manifest.json
            outputs/risk_indicator_panel.csv
            outputs/risk_coverage_audit.json
            outputs/geographical_risk_adjusted_ranking.csv
            outputs/geographical_uncertainty_audit.json
            data/geographical_uncertainty_inputs.csv
            data/geopolitical_uncertainty_inputs.csv
            data/geopolitical_uncertainty_inputs_template.csv
            data/geographical_uncertainty_inputs_template.csv
            outputs/macro_backtest.json
            outputs/macro_backtest_folds.csv
            outputs/macro_backtest_predictions.csv
            outputs/macro_model_coefficients_last_fold.csv
            outputs/macro_backtest_rank_metrics.csv
            data/raw/world_bank_long.csv
            data/raw/world_bank_macro_focus.csv
            metadata/wdi_history_rebuild_manifest.json
            data/raw/eurostat_migration_flows.csv
            data/raw/brazil_world_bank_macro.csv
            data/raw/undesa_migrant_stock_long.csv
            data/raw/unhcr_forced_displacement_focus.csv.gz
            data/raw/oecd_migration_database_focus.csv
            data/raw/ilostat_migrant_labour_focus.csv
            data/observations_history/world_bank_observations.csv.gz
            data/raw/snapshots/world_bank/**/*.json
            data/raw/snapshots/eurostat/**/*.json
            data/raw/snapshots/policy_pages/**/*.html
            data/raw/snapshots/obmigra/**/*.html
            data/raw/snapshots/undesa/**/*.xlsx
            data/raw/snapshots/unhcr/**/*.csv
            data/raw/snapshots/oecd/**/*.csv
            data/raw/snapshots/ilostat/**/*.csv


      - name: Commit report and refreshed data
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Commit lightweight operational outputs and intentionally small country/source extracts.
          # The compact WDI revision ledger and macro-focus scoring input are committed.
          # Raw snapshots and the full current WDI panel remain in the uploaded artifact.
          git add reports/latest_daily_summary.md \
                  metadata/live_source_status.csv \
                  metadata/eurostat_source_status.csv \
                  metadata/obmigra_source_status.csv \
                  metadata/policy_page_watch_status.csv \
                  metadata/unhcr_source_status.csv \
                  metadata/undesa_source_status.csv \
                  metadata/oecd_source_status.csv \
                  metadata/ilostat_source_status.csv \
                  metadata/refresh_runs/ \
                  outputs/data_freshness_dashboard.csv \
                  outputs/latest_macro_eom_ranking.csv \
                  outputs/macro_backtest.json \
                  outputs/macro_backtest_folds.csv \
                  outputs/macro_backtest_rank_metrics.csv \
                  outputs/macro_model_coefficients_last_fold.csv \
                  data/historical_destination_year_panel.csv \
                  data/raw/eurostat_migration_flows.csv \
                  data/raw/brazil_world_bank_macro.csv \
                  data/obmigra_page_state.json \
                  data/policy_page_state.json
          if [ -d data/observations_history ]; then
            git add -A data/observations_history/
          fi
          # Supplemental sources may be unavailable in an individual run. Stage their
          # last successful compact extracts only when a file exists.
          # UNHCR focus extract can exceed GitHub's 100 MB per-file limit.
          # It remains available in the workflow artifact uploaded above; do not add it to Git history.
          for path in data/raw/undesa_migrant_stock_long.csv data/raw/oecd_migration_database_focus.csv data/raw/ilostat_migrant_labour_focus.csv data/raw/world_bank_macro_focus.csv metadata/wdi_history_rebuild_manifest.json; do
            if [ -f "$path" ]; then git add "$path"; fi
          done
          # Preserve the compact risk panel and coverage audit when the risk step produced them.
          for path in outputs/risk_indicator_panel.csv outputs/risk_coverage_audit.json outputs/geographical_risk_adjusted_ranking.csv outputs/geographical_uncertainty_audit.json data/geographical_uncertainty_inputs.csv data/geographical_uncertainty_inputs_template.csv data/geopolitical_uncertainty_inputs.csv data/geopolitical_uncertainty_inputs_template.csv outputs/source_retrieval_audit.csv outputs/policy_event_delta.csv outputs/macro_ranking_delta.csv data/prediction_ledger.csv data/outcome_ledger.csv data/prediction_outcome_join.csv metadata/source_audit_manifest.json metadata/policy_event_delta_manifest.json metadata/prediction_ledger_manifest.json metadata/macro_ranking_delta_manifest.json; do
            if [ -f "$path" ]; then git add "$path"; fi
          done
          # Fail early with a clear message if any staged file approaches GitHub's 100 MB hard limit.
          while IFS= read -r path; do
            if [ -f "$path" ]; then
              size=$(stat -c%s "$path")
              if [ "$size" -ge 90000000 ]; then
                echo "::error::Staged file $path is $size bytes; keep individual GitHub files below 90 MB."
                exit 1
              fi
            fi
          done < <(git diff --cached --name-only)

          if ! git diff --cached --quiet; then
            git commit -m "Automated EOM data refresh"
            # Data-generation steps may leave additional tracked files modified after staging.
            # The artifact has already been uploaded, so stash these unstaged workspace changes
            # before rebasing the committed output. Otherwise git rebase refuses to start.
            if ! git diff --quiet; then
              git stash push -m "EOM refresh unstaged workspace changes"
            fi
            # A human or another workflow may have advanced main since checkout.
            # Rebase the generated commit and retry instead of losing this run's outputs.
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::Generated-output commit conflicts with origin/main; preserve this run's artifact and resolve the conflicting files."
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "Push attempt $attempt raced with a newer main commit; retrying after fetch/rebase."
                sleep $((attempt * 2))
              fi
            done
            echo "::error::Could not push refreshed outputs after 3 fetch/rebase attempts."
            exit 1
          fi

      - name: Mark run failed if required pipeline stages failed
        if: always() && (steps.tests.outcome == 'failure' || steps.refresh_data.outcome == 'failure' || steps.recompute_ranking.outcome == 'failure' || steps.risk_panel.outcome == 'failure' || steps.geographic_evidence.outcome == 'failure' || steps.geopolitical_evidence.outcome == 'failure' || steps.geographic_adjustment.outcome == 'failure' || steps.source_audit.outcome == 'failure' || steps.policy_delta.outcome == 'failure' || steps.prediction_ledger.outcome == 'failure' || steps.ranking_delta.outcome == 'failure')
        run: |
          echo "Daily report was generated, but a required test, data refresh, ranking, risk panel, or geographic evidence stage failed. Inspect the step logs."
          exit 1
