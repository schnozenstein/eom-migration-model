name: EOM Daily Refresh

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/refresh_eom_data.py"
      - "scripts/create_daily_summary.py"
      - "src/eom_empirical/**"
      - "data/destinations.csv"
      - "data/historical_destination_year_panel.csv"
      - "LIVE_DATA_PIPELINE.md"
      - "tests/**"
      - ".github/workflows/eom-daily-refresh.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/refresh_eom_data.py"
      - "scripts/create_daily_summary.py"
      - "src/eom_empirical/**"
      - "data/destinations.csv"
      - "data/historical_destination_year_panel.csv"
      - "LIVE_DATA_PIPELINE.md"
      - "tests/**"
      - ".github/workflows/eom-daily-refresh.yml"
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest

      - name: Run tests
        id: tests
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python -m pytest -q

      - name: Refresh EOM data
        if: github.event_name != 'pull_request'
        id: refresh_data
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python scripts/refresh_eom_data.py

      - name: Recompute macro EOM ranking from current destination set
        if: github.event_name != 'pull_request'
        id: recompute_ranking
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          python -m eom_empirical.fetch_world_bank --start 2010 --end "$(date -u +%Y)"
          python -m eom_empirical.fit_macro_model

      - name: Build environmental and economic risk indicator panel
        if: github.event_name != 'pull_request'
        id: risk_panel
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python -m eom_empirical.build_risk_panel

      - name: Create human-readable report
        if: always()
        run: python scripts/create_daily_summary.py

      - name: Upload daily report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eom-daily-report-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            reports/latest_daily_summary.md
            metadata/live_source_status.csv
            metadata/eurostat_source_status.csv
            metadata/obmigra_source_status.csv
            metadata/policy_page_watch_status.csv
            metadata/unhcr_source_status.csv
            metadata/undesa_source_status.csv
            metadata/oecd_source_status.csv
            metadata/ilostat_source_status.csv
            metadata/refresh_runs/*.json
            outputs/data_freshness_dashboard.csv
            outputs/latest_macro_eom_ranking.csv
            outputs/macro_backtest.json
            outputs/macro_backtest_folds.csv
            outputs/macro_backtest_predictions.csv
            outputs/macro_model_coefficients_last_fold.csv
            outputs/macro_backtest_rank_metrics.csv
            data/raw/world_bank_long.csv
            data/raw/eurostat_migration_flows.csv
            data/raw/brazil_world_bank_macro.csv
            data/raw/undesa_migrant_stock_long.csv
            data/raw/unhcr_forced_displacement_focus.csv.gz
            data/raw/oecd_migration_database_focus.csv
            data/raw/ilostat_migrant_labour_focus.csv
            data/raw/snapshots/undesa/**/*.xlsx

      - name: Commit report and refreshed data
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Commit lightweight operational outputs and intentionally small country/source extracts.
          # The full all-country World Bank history and raw source snapshots are not committed
          # because they exceed GitHub's 100 MB limit or grow every run. Full diagnostics remain
          # available in the uploaded workflow artifact.
          git add reports/latest_daily_summary.md \
                  metadata/live_source_status.csv \
                  metadata/eurostat_source_status.csv \
                  metadata/obmigra_source_status.csv \
                  metadata/policy_page_watch_status.csv \
                  metadata/unhcr_source_status.csv \
                  metadata/undesa_source_status.csv \
                  metadata/oecd_source_status.csv \
                  metadata/ilostat_source_status.csv \
                  metadata/refresh_runs/ \
                  outputs/data_freshness_dashboard.csv \
                  outputs/latest_macro_eom_ranking.csv \
                  outputs/macro_backtest.json \
                  outputs/macro_backtest_folds.csv \
                  outputs/macro_backtest_rank_metrics.csv \
                  outputs/macro_model_coefficients_last_fold.csv \
                  data/historical_destination_year_panel.csv \
                  data/raw/eurostat_migration_flows.csv \
                  data/raw/brazil_world_bank_macro.csv \
                  data/obmigra_page_state.json \
                  data/policy_page_state.json
          # Supplemental sources may be unavailable in an individual run. Stage their
          # last successful compact extracts only when a file exists.
          # UNHCR focus extract can exceed GitHub's 100 MB per-file limit.
          # It remains available in the workflow artifact uploaded above; do not add it to Git history.
          for path in data/raw/undesa_migrant_stock_long.csv data/raw/oecd_migration_database_focus.csv data/raw/ilostat_migrant_labour_focus.csv; do
            if [ -f "$path" ]; then git add "$path"; fi
          done
          # Fail early with a clear message if any staged file approaches GitHub's 100 MB hard limit.
          while IFS= read -r path; do
            if [ -f "$path" ]; then
              size=$(stat -c%s "$path")
              if [ "$size" -ge 90000000 ]; then
                echo "::error::Staged file $path is $size bytes; keep individual GitHub files below 90 MB."
                exit 1
              fi
            fi
          done < <(git diff --cached --name-only)

          if ! git diff --cached --quiet; then
            git commit -m "Automated EOM data refresh"
            git push
          fi

      - name: Mark run failed if tests, data refresh, or ranking failed
        if: always() && (steps.tests.outcome == 'failure' || steps.refresh_data.outcome == 'failure' || steps.recompute_ranking.outcome == 'failure')
        run: |
          echo "Daily report was generated, but tests or live data refresh failed. Inspect the source status CSV and step logs."
          exit 1
