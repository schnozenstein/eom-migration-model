name: EOM Web Platform CI

on:
  push:
    branches: ["main", "feature/**"]
    paths:
      - "webapp/**"
      - "tests/test_web_api.py"
      - ".github/workflows/eom-web-ci.yml"
  pull_request:
    paths:
      - "webapp/**"
      - "tests/test_web_api.py"
      - ".github/workflows/eom-web-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r webapp/backend/requirements.txt pytest
      - run: python -m pytest -q tests/test_web_api.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: webapp/frontend
        run: npm install
      - working-directory: webapp/frontend
        run: npm run build
